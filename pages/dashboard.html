<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Dashboard – Go Time Software</title>

  <link rel="icon" type="image/png" href="/assets/img/go-time-logo.png" />
  <link rel="stylesheet" href="/css/base.css" />

  <style>
    body.theme-dark {
      background: #000;
    }

    .dashboard-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .entry {
      background: rgba(0,0,0,0.35);
      border: 1px solid #550000;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 0 14px #55000055;
    }

    .entry h3 {
      margin: 0 0 10px 0;
      color: #ff3b3b;
    }

    .entry small {
      color: #bbb;
    }

    .details-block {
      margin-top: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      border: 1px solid #333;
    }

    .details-block p {
      margin: 6px 0;
      color: #ddd;
      font-size: 15px;
    }
  </style>
</head>

<body class="theme-dark">

  <main class="dashboard-container">
    <h1>Admin Dashboard</h1>
    <p>All project requests submitted through the contact page.</p>

    <div id="entries"></div>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
