<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Real Apps – Go Time Software</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/img/go-time-logo.png" />
  <link rel="shortcut icon" href="./favicon.ico" />

  <!-- ONE CSS ONLY -->
  <link rel="stylesheet" href="./css/base.css" />

  <!-- Background -->
  <style>
    body.theme-dark {
      background: url("./assets/img/go-time-background.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    body.theme-dark::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(2px);
      z-index: -1;
    }
  </style>

  <!-- REAL APPS JS (THE NEW SYSTEM) -->
  <script src="./js/real-apps.js" defer></script>
</head>

<body class="theme-dark">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">
      <img src="./assets/img/go-time-logo.png" class="logo-img" />
      <span>Go Time Software</span>
    </div>

    <nav class="main-nav">
      <a href="./index.html">Home</a>
      <a href="./sites.html">Sites</a>
      <a href="./apps.html">Apps</a>
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <!-- MAIN -->
  <main class="page-container">

    <h1>Real Apps</h1>
    <p>
      These are real Progressive Web Apps (PWAs) built by Go Time Software.  
      You can install them directly to your home screen.
    </p>

    <!-- REAL APPS GRID -->
    <div id="realAppsGrid" class="real-apps-grid"></div>

  </main>

  <!-- MODAL VIEWER -->
  <div id="appModal" class="app-modal hidden">
    <div class="app-modal-content">
      <span class="app-modal-close" onclick="closeAppModal()">×</span>

      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>

      <h3>Install as an App (PWA)</h3>
      <p id="modalPwa"></p>

      <div id="modalScreenshots" class="modal-screenshots"></div>

      <a id="modalLaunchBtn" class="btn-primary" target="_blank">Open Full App</a>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="site-footer">
    <span>© Go Time Software</span>
  </footer>

</body>
</html>
