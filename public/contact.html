<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – Go Time Software</title>

  <link rel="icon" type="image/png" href="./assets/img/go-time-logo.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/theme.css" />
</head>

<body class="theme-dark">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">
      <img src="./assets/img/go-time-logo.png" class="logo-img" />
      <span>Go Time Software</span>
    </div>
    <nav class="main-nav">
      <a href="./index.html">Home</a>
      <a href="./sites.html">Sites</a>
      <a href="./apps.html">Apps</a>
      <a href="./about.html">About</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>

  <main class="page-container">
    <h1>Contact Us</h1>
    <p>Tell us about your project. We respond fast.</p>

    <form class="contact-form">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <input type="text" placeholder="Business Name (optional)" />
      <textarea placeholder="Tell us about your project…" required></textarea>
      <button class="btn-primary">Send Message</button>
    </form>
  </main>

  <footer class="site-footer">
    <span>© Go Time Software</span>
  </footer>

</body>
</html>
