<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact – Go Time Software</title>

  <link rel="icon" type="image/png" href="/assets/img/go-time-logo.png" />
  <link rel="stylesheet" href="/css/base.css" />

  <style>
    body.theme-dark {
      background: url("/assets/img/go-time-back-logo.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    body.theme-dark::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75); /* DARKER OVERLAY FOR READABILITY */
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    .contact-page {
      max-width: 900px;
      margin: 80px auto;
      padding: 20px;
      animation: fadeIn 1.2s ease forwards;
      color: #fff; /* TEXT VISIBLE */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glass-block {
      background: rgba(0,0,0,0.55); /* LIGHTER GLASS */
      border: 1px solid #aa0000;
      padding: 30px;
      border-radius: 14px;
      margin: 40px 0;
      box-shadow: 0 0 18px #55000088;
    }

    .glass-block h2,
    .glass-block p {
      color: #fff;
    }

    .contact-form input,
    .contact-form textarea,
    .contact-form select {
      background: rgba(255,255,255,0.08); /* LIGHTER INPUT BACKGROUND */
      border: 1px solid #ff3b3b;
      color: #fff;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
      box-shadow: 0 0 10px #000 inset;
      margin-bottom: 16px;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #cccccc;
    }

    .contact-form textarea {
      min-height: 120px;
    }

    .btn-primary {
      background: #ff3b3b;
      padding: 14px;
      border-radius: 10px;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 12px #550000aa;
    }

    .btn-primary:hover {
      background: #cc2a2a;
    }

    .success-box {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,255,0,0.15);
      border: 1px solid #00aa00;
      border-radius: 10px;
      color: #b6ffb6;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body class="theme-dark">

  <main class="page-container contact-page">

    <h1>Contact Us</h1>
    <p>Select what you want built, then fill out the detailed form.</p>

    <div class="glass-block">
      <select id="projectType">
        <option value="">Select Project Type</option>
        <option value="Website">Website</option>
        <option value="App">App</option>
        <option value="IoT System">IoT System</option>
        <option value="Dashboard">Dashboard</option>
        <option value="Repair">Electronics Repair</option>
        <option value="Drone">Custom Drone Build</option>
        <option value="RC Vehicle">RC Vehicle Build</option>
        <option value="Guide App">Personalized Guide App</option>
      </select>
    </div>

    <!-- ALL FORMS -->
    <div id="formsContainer">

      <!-- WEBSITE FORM -->
      <form class="contact-form hidden" data-type="Website">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <input placeholder="Business Name (optional)" />
        <input placeholder="Preferred Colors" />
        <input placeholder="Number of Pages" />
        <textarea placeholder="Describe the website you want"></textarea>
        <textarea placeholder="Examples of sites you like"></textarea>
        <button class="btn-primary">Submit Website Request</button>
      </form>

      <!-- APP FORM -->
      <form class="contact-form hidden" data-type="App">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <input placeholder="Business Name (optional)" />
        <select>
          <option value="">Platform</option>
          <option>iOS</option>
          <option>Android</option>
          <option>Both</option>
          <option>Web App</option>
        </select>
        <textarea placeholder="Describe the app idea"></textarea>
        <textarea placeholder="Key features needed"></textarea>
        <button class="btn-primary">Submit App Request</button>
      </form>

      <!-- IOT FORM -->
      <form class="contact-form hidden" data-type="IoT System">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <input placeholder="Business Name (optional)" />
        <input placeholder="Device Type" />
        <textarea placeholder="What should the device do?"></textarea>
        <textarea placeholder="Sensors or data needed"></textarea>
        <button class="btn-primary">Submit IoT Request</button>
      </form>

      <!-- DASHBOARD FORM -->
      <form class="contact-form hidden" data-type="Dashboard">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <input placeholder="Business Name (optional)" />
        <textarea placeholder="What data should the dashboard show?"></textarea>
        <textarea placeholder="What features do you need?"></textarea>
        <button class="btn-primary">Submit Dashboard Request</button>
      </form>

      <!-- REPAIR FORM -->
      <form class="contact-form hidden" data-type="Repair">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <input placeholder="Device Type" />
        <textarea placeholder="Describe the issue"></textarea>
        <button class="btn-primary">Submit Repair Request</button>
      </form>

      <!-- DRONE FORM -->
      <form class="contact-form hidden" data-type="Drone">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <textarea placeholder="Describe the drone you want built"></textarea>
        <textarea placeholder="Flight features needed"></textarea>
        <button class="btn-primary">Submit Drone Request</button>
      </form>

      <!-- RC VEHICLE FORM -->
      <form class="contact-form hidden" data-type="RC Vehicle">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <textarea placeholder="Describe the RC vehicle"></textarea>
        <textarea placeholder="Speed, size, features"></textarea>
        <button class="btn-primary">Submit RC Vehicle Request</button>
      </form>

      <!-- GUIDE APP FORM -->
      <form class="contact-form hidden" data-type="Guide App">
        <input placeholder="Your Name" required />
        <input placeholder="Your Email" required />
        <textarea placeholder="What should the guide app teach or guide?"></textarea>
        <textarea placeholder="Features needed"></textarea>
        <button class="btn-primary">Submit Guide App Request</button>
      </form>

    </div>

    <div id="successBox" class="success-box">
      Message sent! We’ll reach out shortly.
    </div>

  </main>

  <script src="/js/contact.js"></script>
</body>
</html>
