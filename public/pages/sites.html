<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Website Templates – Go Time Software</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/img/go-time-logo.png" />

  <!-- Base Styles -->
  <link rel="stylesheet" href="/css/base.css" />

  <!-- Background -->
  <style>
    body.theme-dark {
      background: url("/assets/img/go-time-town.jpg") no-repeat center center fixed;
      background-size: cover;
    }
    body.theme-dark::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(3px);
      z-index: -1;
    }

    /* PAGE TITLE */
    .page-header {
      text-align: center;
      margin-top: 60px;
      animation: fadeIn 1.2s ease forwards;
    }

    .page-header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .page-header p {
      font-size: 20px;
      opacity: 0.85;
    }

    /* TEMPLATE GRID */
    .template-grid {
      margin: 60px auto;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
      padding: 20px;
      animation: fadeIn 1.4s ease forwards;
    }

    /* TEMPLATE CARD */
    .template-card {
      background: rgba(0,0,0,0.35);
      border: 1px solid #550000;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 0 18px #55000055;
      cursor: pointer;
      transition: 0.25s ease;
      backdrop-filter: blur(2px);
    }

    .template-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 22px #ff3b3b88;
      border-color: #ff3b3b;
    }

    .template-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 0 12px #000000aa;
    }

    .template-card h3 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    .template-card p {
      opacity: 0.85;
      font-size: 16px;
      line-height: 1.5;
    }

    /* ANIMATION */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- JS -->
  <script src="/js/sites-viewer.js" defer></script>
</head>

<body class="theme-dark">

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">
      <img src="/assets/img/go-time-logo.png" class="logo-img" />
      <span>Go Time Software</span>
    </div>

    <nav class="main-nav">
      <a href="/index.html">Home</a>
      <a href="/pages/sites.html">Sites</a>
      <a href="/pages/apps.html">Apps</a>
      <a href="/pages/iot.html">IoT</a>
      <a href="/pages/pricing.html">Pricing</a>
      <a href="/pages/contact.html">Contact</a>
    </nav>
  </header>

  <!-- PAGE TITLE -->
  <section class="page-header">
    <h1>Website Templates</h1>
    <p>Real, interactive, cinematic website templates — built by Go Time Software.</p>
  </section>

  <!-- TEMPLATE GRID -->
  <section class="template-grid" id="site-templates-row">
    <!-- JS will inject cards here -->
  </section>

  <!-- FOOTER -->
  <footer class="site-footer">
    <span>© Go Time Software</span>
  </footer>

</body>
</html>
