<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Go Time Mobile Phone Repair</title>
  <link rel="stylesheet" href="/css/base.css">
</head>

<body>

<section class="repair-wrapper">

  <h1>Go Time Mobile Phone Repair</h1>
  <p class="sub">Premium On‑Site Repair • Atlanta + Surrounding Areas</p>

  <!-- PHONE MODEL -->
  <div class="block">
    <label>Phone Model</label>
    <select id="phoneModel">
      <option value="">Select your phone</option>
      <option value="se">iPhone SE (2nd/3rd Gen)</option>
      <option value="12">iPhone 12 / 12 Mini</option>
      <option value="13">iPhone 13 / 13 Mini</option>
      <option value="14">iPhone 14 / 14 Plus</option>
      <option value="15">iPhone 15 / 15 Plus</option>
      <option value="15pm">iPhone 15 Pro Max</option>
      <option value="16">iPhone 16 / 16 Plus</option>
      <option value="16pm">iPhone 16 Pro Max</option>
      <option value="17pm">iPhone 17 Pro Max</option>
    </select>
  </div>

  <!-- REPAIR TYPE -->
  <div class="block">
    <label>Repair Needed</label>
    <select id="repairType">
      <option value="">Select repair type</option>
      <option value="screen">Screen Replacement</option>
      <option value="battery">Battery Replacement</option>
    </select>
  </div>

  <!-- EXPLANATION -->
  <div id="explainBox" class="hidden">
    <h2 id="repairTitle"></h2>

    <div class="img-row">
      <img id="symptomImg" src="" alt="">
      <img id="resultImg" src="" alt="">
    </div>

    <h3>Symptoms</h3>
    <ul id="symptoms"></ul>

    <h3>What You Get With Go Time</h3>
    <ul id="results"></ul>
  </div>

  <!-- PRICE + DEPOSIT -->
  <div id="priceBox" class="hidden">
    <h2>Total Price: <span id="totalPrice"></span></h2>
    <h3>Deposit Required: <span id="depositPrice"></span></h3>

    <a id="formLink" class="btn" href="#">Continue to Booking Form</a>
  </div>

</section>

<script src="js/pages/phone-repair.js"></script>
</body>
</html>
