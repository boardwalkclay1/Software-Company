<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Go Time CYD – Phone Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    background:#000;
    color:#fff;
    font-family:system-ui, sans-serif;
    padding:20px;
  }
  button {
    padding:12px 18px;
    margin-top:10px;
    border-radius:8px;
    border:none;
    background:#ff0000;
    color:#fff;
    font-weight:bold;
  }
  input {
    width:100%;
    padding:8px;
    margin:6px 0;
    border-radius:6px;
    border:1px solid #444;
    background:#111;
    color:#fff;
  }
  .log {
    margin-top:15px;
    font-size:13px;
    opacity:0.8;
    white-space:pre-wrap;
  }
</style>
</head>
<body>

<h2>Go Time CYD – Phone Link</h2>
<p>Connect to <b>GoTime-CYD</b> WiFi, then use this page to send your phone's location and heading to the CYD.</p>

<label>CYD IP (default 192.168.4.1)</label>
<input id="ip" value="192.168.4.1" />

<button id="btn-once">Send Once</button>
<button id="btn-start">Start Live Updates</button>
<button id="btn-stop">Stop Live</button>

<div class="log" id="log"></div>

<script>
let watchId = null;
let liveTimer = null;

function log(msg) {
  const el = document.getElementById("log");
  el.textContent = msg + "\n" + el.textContent;
}

async function sendUpdate(lat, lon, heading, temp, main, desc) {
  const ip = document.getElementById("ip").value.trim();
  const url = `http://${ip}/update?lat=${lat}&lon=${lon}&heading=${heading}&temp=${temp}&main=${encodeURIComponent(main)}&desc=${encodeURIComponent(desc)}`;
  try {
    const res = await fetch(url);
    const txt = await res.text();
    log("Sent: " + url + "\nResp: " + txt);
  } catch (e) {
    log("Error: " + e);
  }
}

function getHeadingFromOrientation(ev) {
  if (typeof ev.alpha === "number") {
    return ev.alpha; // 0–360
  }
  return 0;
}

let lastHeading = 0;
window.addEventListener("deviceorientation", (ev) => {
  lastHeading = getHeadingFromOrientation(ev);
}, true);

function getWeatherStub() {
  // You can later replace this with real phone weather API
  return {
    temp: 22.4,
    main: "Clouds",
    desc: "phone weather"
  };
}

function sendOnce() {
  if (!navigator.geolocation) {
    log("Geolocation not supported.");
    return;
  }
  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const heading = lastHeading || 0;
    const w = getWeatherStub();
    sendUpdate(lat, lon, heading, w.temp, w.main, w.desc);
  }, err => {
    log("Geo error: " + err.message);
  });
}

function startLive() {
  if (!navigator.geolocation) {
    log("Geolocation not supported.");
    return;
  }
  if (liveTimer) {
    log("Live already running.");
    return;
  }
  liveTimer = setInterval(() => {
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const heading = lastHeading || 0;
      const w = getWeatherStub();
      sendUpdate(lat, lon, heading, w.temp, w.main, w.desc);
    }, err => {
      log("Geo error: " + err.message);
    });
  }, 3000); // every 3s
  log("Live updates started.");
}

function stopLive() {
  if (liveTimer) {
    clearInterval(liveTimer);
    liveTimer = null;
    log("Live updates stopped.");
  }
}

document.getElementById("btn-once").onclick = sendOnce;
document.getElementById("btn-start").onclick = startLive;
document.getElementById("btn-stop").onclick = stopLive;
</script>

</body>
</html>
