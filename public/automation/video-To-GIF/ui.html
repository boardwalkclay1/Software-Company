<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Go‑Time Video → GIF Converter</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    margin: 0;
    padding: 40px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 420px;
    background: #161b22;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(0,0,0,0.4);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #58a6ff;
  }

  input[type="file"] {
    width: 100%;
    margin-bottom: 20px;
  }

  button {
    width: 100%;
    padding: 12px;
    background: #238636;
    border: none;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  button:disabled {
    background: #2ea04388;
    cursor: not-allowed;
  }

  #status {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
  }

  .progressBar {
    width: 100%;
    height: 10px;
    background: #30363d;
    border-radius: 5px;
    margin-top: 10px;
    overflow: hidden;
  }

  .progressFill {
    height: 100%;
    width: 0%;
    background: #58a6ff;
    transition: width 0.3s ease;
  }

  #downloadLink {
    display: none;
    margin-top: 20px;
    text-align: center;
    padding: 10px;
    background: #1f6feb;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
  }
</style>

</head>
<body>

<div class="container">
  <h1>Video → GIF</h1>

  <input type="file" id="videoInput" accept="video/*">
  <button id="convertBtn">Convert to GIF</button>

  <div class="progressBar">
    <div id="progress" class="progressFill"></div>
  </div>

  <p id="status"></p>

  <a id="downloadLink">Download GIF</a>
</div>

<script src="libs/ffmpeg.min.js"></script>
<script src="automation.js"></script>

</body>
</html>
