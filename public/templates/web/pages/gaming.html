<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gaming Hub – Go Time Software</title>

  <!-- ONE CSS FILE -->
  <link rel="stylesheet" href="../css/gaming.css">

  <!-- ONE JS FILE -->
  <script src="../js/gaming.js" defer></script>
</head>

<body>

  <header class="header">
    <div class="logo">Go Time <span>Arcade</span></div>
    <nav class="nav">
      <a href="#games">Games</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>Play Classic Browser Games</h1>
      <p>Snake, Pong, Tetris — simple, fast, and fun.</p>
    </section>

    <section id="games" class="games-section">
      <h2>Games</h2>

      <div class="game-grid">

        <div class="game-card" data-game="snake">
          <h3>Snake</h3>
          <button class="btn-play">Play</button>
        </div>

        <div class="game-card" data-game="pong">
          <h3>Pong</h3>
          <button class="btn-play">Play</button>
        </div>

        <div class="game-card" data-game="tetris">
          <h3>Tetris</h3>
          <button class="btn-play">Play</button>
        </div>

      </div>

      <div id="game-area" class="game-area">
        <p>Select a game to start playing.</p>
      </div>
    </section>

    <section id="about" class="about-section">
      <h2>About This Template</h2>
      <p>
        This is a minimal, clean gaming hub template.  
        All games run directly in the browser with no downloads.
      </p>
    </section>

  </main>

</body>
</html>
