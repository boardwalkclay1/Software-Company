<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gaming Hub – Go Time Software</title>

  <link rel="stylesheet" href="../css/gaming.css">
  <script src="../js/gaming.js" defer></script>
</head>

<body>

  <header class="header">
    <div class="logo">Go Time <span>Arcade</span></div>
  </header>

  <main>

    <section class="hero">
      <h1>Classic Browser Games</h1>
      <p>Snake, Pong, Tetris — simple, fast, and fun.</p>
    </section>

    <section class="games-section">
      <div class="game-grid">

        <div class="game-card" data-game="snake">
          <h3>Snake</h3>
          <p>Eat. Grow. Survive.</p>
        </div>

        <div class="game-card" data-game="pong">
          <h3>Pong</h3>
          <p>The original duel.</p>
        </div>

        <div class="game-card" data-game="tetris">
          <h3>Tetris</h3>
          <p>Stack. Clear. Repeat.</p>
        </div>

      </div>

      <div id="game-area" class="game-area">
        <p>Select a game to start playing.</p>
      </div>
    </section>

  </main>

</body>
</html>
