<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Go Time Marketplace Template</title>
  <link rel="stylesheet" href="../css/web-base.css" />
  <link rel="stylesheet" href="../css/web-layout.css" />
  <link rel="stylesheet" href="../css/web-theme-dark.css" />
</head>
<body class="theme-dark">
  <header class="site-header">
    <div class="logo">Go Time <span>Market</span></div>
    <nav class="nav">
      <a href="#products">Products</a>
      <a href="#categories">Categories</a>
      <a href="#cart">Cart</a>
    </nav>
  </header>

  <main>
    <!-- HERO -->
    <section class="market-hero">
      <div>
        <h1>Find the Tools You Need.</h1>
        <p>Use this marketplace layout for digital products, services, or physical goods.</p>
        <div class="market-search">
          <input type="text" id="search-input" placeholder="Search products..." />
          <button class="btn btn-primary">Search</button>
        </div>
      </div>
    </section>

    <!-- FILTERS -->
    <section id="categories" class="section">
      <h2>Categories</h2>
      <div class="chip-row">
        <button class="chip chip-active" data-filter="all">All</button>
        <button class="chip" data-filter="dashboard">Dashboards</button>
        <button class="chip" data-filter="template">Templates</button>
        <button class="chip" data-filter="service">Services</button>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section id="products" class="section">
      <h2>Products</h2>
      <div id="product-grid" class="product-grid">
        <!-- JS will populate cards -->
      </div>
    </section>

    <!-- CART PREVIEW -->
    <section id="cart" class="section section-alt">
      <h2>Cart</h2>
      <div id="cart-empty">Your cart is empty.</div>
      <ul id="cart-list" class="cart-list"></ul>
      <div id="cart-summary" class="cart-summary hidden">
        <span id="cart-count"></span>
        <span id="cart-total"></span>
        <button class="btn btn-primary">Checkout</button>
      </div>
    </section>
  </main>

  <script src="../js/marketplace.js" type="module"></script>
</body>
</html>
